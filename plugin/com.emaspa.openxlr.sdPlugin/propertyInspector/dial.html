<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { font-family: sans-serif; background: #16181d; color: #e6e9f0;
         margin: 10px; font-size: 13px; }
  label { display: block; margin-bottom: 6px; color: #8b93a7; }
  :root { color-scheme: dark; }
  select { width: 100%; background: #23262f; color: #e6e9f0;
           border: 1px solid #3a3f4c; border-radius: 5px; padding: 6px;
           appearance: none; -webkit-appearance: none; }
  option, optgroup { background: #23262f; color: #e6e9f0; }
  button { background: #23262f; color: #e6e9f0; border: 1px solid #3a3f4c;
           border-radius: 5px; padding: 5px 10px; margin-top: 8px; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 10px 0 0 0; }
  li { background: #1d2027; border: 1px solid #3a3f4c; border-radius: 5px;
       padding: 5px 8px; margin-bottom: 5px; display: flex;
       justify-content: space-between; align-items: center; }
  li button { margin: 0; padding: 1px 7px; }
</style></head>
<body>
  <label for="target">Dial stack: add one or more controls (long-press the strip to cycle)</label>
  <select id="target">
    <option value="">choose…</option>
    <optgroup label="Device">
      <option value="outputVolume">Monitor output volume</option>
      <option value="gain">XLR 1 gain</option>
      <option value="gain2">XLR 2 gain</option>
      <option value="hp">Headphones 1 volume</option>
      <option value="hp2">Headphones 2 volume</option>
      <option value="auxLevel">Aux In level</option>
      <option value="crossfade">Mic / PC crossfade</option>
    </optgroup>
  </select>
  <button id="add">Add to stack</button>
  <ul id="stack"></ul>
  <label style="margin-top:12px">Cycle the stack with (the other gesture mutes)</label>
  <div>
    <label style="display:inline"><input type="radio" name="gesture" value="tap" checked> Screen tap</label>
    <label style="display:inline; margin-left:14px"><input type="radio" name="gesture" value="push"> Dial press</label>
  </div>
  <script>
    let ws = null, piUuid = null, settings = {};

    function connect(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
      piUuid = inPropertyInspectorUUID;
      const actionInfo = JSON.parse(inActionInfo);
      settings = actionInfo.payload?.settings ?? {};
      if (!Array.isArray(settings.targets))
        settings.targets = settings.target ? [settings.target] : [];
      ws = new WebSocket("ws://localhost:" + inPort);
      ws.onopen = () => {
        ws.send(JSON.stringify({ event: inRegisterEvent, uuid: piUuid }));
        const g = settings.cycleGesture ?? "tap";
        document.querySelector('input[name="gesture"][value="' + g + '"]').checked = true;
        for (const r of document.querySelectorAll('input[name="gesture"]'))
          r.addEventListener("change", () => {
            settings.cycleGesture = document.querySelector('input[name="gesture"]:checked').value;
            save();
          });
        render();
        // The plugin lists both the editable mixer layout and loaded insert
        // controls from live daemon state.
        for (const request of ["layout", "inserts"])
          ws.send(JSON.stringify({ event: "sendToPlugin", context: actionInfo.context,
                                   payload: { request } }));
      };
      ws.onmessage = (e) => {
        let m;
        try { m = JSON.parse(e.data); } catch { return; }
        if (m.event !== "sendToPropertyInspector") return;
        const sel = document.getElementById("target");
        const addGroup = (id, label, items) => {
          if (document.getElementById(id) || !items?.length) return;
          const group = document.createElement("optgroup");
          group.id = id;
          group.label = label;
          for (const it of items) {
            const opt = document.createElement("option");
            opt.value = it.target;
            opt.textContent = it.label;
            if (it.meta) opt.dataset.meta = JSON.stringify(it.meta);
            group.appendChild(opt);
          }
          sel.appendChild(group);
        };
        if (Array.isArray(m.payload?.levelGroups)) {
          for (const group of m.payload.levelGroups)
            addGroup(group.id, group.label, group.items);
        }
        if (Array.isArray(m.payload?.params)) {
          addGroup("param-group", "Insert plugin controls", m.payload.params);
        }
        render();   // dynamic controls now have readable labels
      };
    }
    window.connectElgatoStreamDeckSocket = connect;
    window.connectOpenActionSocket = connect;

    function save() {
      settings.target = settings.targets[0] ?? "";
      settings.activeIndex = 0;
      ws.send(JSON.stringify({ event: "setSettings", context: piUuid, payload: settings }));
    }
    function labelFor(v) {
      const o = document.querySelector('#target option[value="' + v + '"]');
      return o ? o.textContent : v;
    }
    function render() {
      const ul = document.getElementById("stack");
      ul.innerHTML = "";
      settings.targets.forEach((t, i) => {
        const li = document.createElement("li");
        const x = document.createElement("button");
        x.textContent = "\u2715";
        x.onclick = () => { settings.targets.splice(i, 1); save(); render(); };
        li.append(labelFor(t) + " ", x);
        ul.appendChild(li);
      });
    }
    document.getElementById("add").onclick = () => {
      const sel = document.getElementById("target");
      const v = sel.value;
      if (!v || !ws) return;
      // Insert controls carry {plugin, index} so the dial survives a chain
      // rebuild that hands the insert a new id.
      const meta = sel.selectedOptions[0]?.dataset.meta;
      if (meta) { settings.meta = settings.meta ?? {}; settings.meta[v] = JSON.parse(meta); }
      settings.targets.push(v); save(); render();
    };
  </script>
</body></html>
