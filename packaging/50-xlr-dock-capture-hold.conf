# Elgato XLR Dock: its capture stream must be running before any playback
# stream opens, or the kernel starves the capture endpoint and the mic
# delivers pure silence (Linux full-duplex ordering bug, works on Windows).
# Keep the capture source from ever suspending so it always starts first.
#
# The unit's own clock: lift the capture node's priority.driver to 2200, so
# when the unit's microphone shares a graph with a capture card or a webcam,
# the unit drives it and the other device is the one resampled, never the
# microphone. On a profile that is not pro-audio WirePlumber gives a USB
# input 2100 or 2109, the same as such a device, and the higher number
# drives: an Elgato 4K X capture card (2109) drove a Wave XLR (2100) and its
# microphone garbled until the card was taken out of the graph (issue #474).
# 2200 beats the USB inputs in the 2000s and stays below the 2600 of a
# pro-audio input, the Wave XLR Pro's among them, so a Pro still drives. A
# unit on pro-audio has 2600 already and is left alone. priority.session,
# which picks the default source, is not changed.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input\\.usb-Elgato_Systems_Elgato_XLR_Dock.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input\\.usb-Elgato_Systems_Elgato_XLR_Dock.*", device.profile.name = "!~^pro-.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 2200
      }
    }
  }
]
