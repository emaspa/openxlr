# Installed by OpenXLR as /usr/lib/systemd/user/pipewire.service.d/openxlr.conf
#
# The PipeWire server holds a buffer and an event descriptor for every node
# and port, and OpenXLR's mixer adds a few hundred of them. When WirePlumber
# restarts, PipeWire hands every node over to it again, and with systemd's
# default soft limit of 1024 open files that handover runs out of
# descriptors: WirePlumber then links nothing and every stream stays silent.
# Raise the limit for the PipeWire server.
# Takes effect at the next login, or after "systemctl --user daemon-reload"
# and "systemctl --user restart pipewire", which restarts every audio service.
[Service]
LimitNOFILE=65536
