# Original Wave XLR (MK.1, 0fd9:007d): the same full-duplex ordering bug as
# the XLR Dock (see 50-xlr-dock-capture-hold.conf), reproduced and confirmed
# live. Its full-speed (12 Mbit/s) USB link ties the card's capture and
# playback ALSA nodes into one PipeWire node group (pw-dump: both share
# node.group). If a playback stream opens on this device before its capture
# stream has been established, the mic goes silent for the life of that
# capture stream: bit-exact zero, structurally normal (right sample count,
# right timing, no errors), even though a plain arecord against the same
# hardware, run in isolation, captures real audio every time. Capture
# starting first and playback joining later is fine, repeatedly verified
# live, including racing a playback stream in within 0.3 s of daemon start.
# Same fix as the Dock: never let the capture node suspend, so it is always
# the one already running when anything else opens playback on the card.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\.usb-Elgato_Systems_Elgato_Wave_XLR_.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
      }
    }
  }
]
