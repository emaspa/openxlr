name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every night the whole suite runs on main with nothing skipped, which
  # catches what path gating defers and changes in the runner images.
  schedule:
    - cron: "23 3 * * *"

# A newer push to the same pull request, or a newer merge to main, cancels
# the run it replaces; only the tip can be merged or released. The nightly
# run has its own group, so a merge does not cancel it.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the tag is in the comment) so a moved
# tag upstream cannot change what runs here.
permissions:
  contents: read

jobs:
  # A change that touches only prose, pictures or the deck plugin's script
  # builds nothing, and the Omarchy QML check runs only for its own files.
  # Skipped jobs still report, which the required ci-ok check counts as
  # passing; a workflow-level paths-ignore would never report it and leave
  # the pull request waiting. The checks job runs for every change.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      omarchy: ${{ steps.diff.outputs.omarchy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request checks out its merge commit, whose first parent is
          # the base. A push to main compares with the previous tip; a run
          # started by hand or by the schedule has none, so it runs
          # everything.
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          fi
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "omarchy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No build or test reads these. SkinDocumentTests holds
          # docs/skins.md to the skin tokens, and the deck plugin's JSON
          # files are read by tests, so neither is listed.
          inert='\.md$|^docs/.*\.(png|svg)$|^plugin/com\.emaspa\.openxlr\.sdPlugin/.*\.(mjs|html|css|js)$|^plugin/tests/'
          if printf '%s\n' "$files" | grep -Ev "$inert" | grep -q . ||
             printf '%s\n' "$files" | grep -qx 'docs/skins.md'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only prose, pictures or the deck plugin's script changed; skipping the build and tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -Eq '^packaging/omarchy/|^tools/check-omarchy\.py$|^tools/omarchy-qml-imports/|^\.github/workflows/ci\.yml$'; then
            echo "omarchy=true" >> "$GITHUB_OUTPUT"
          else
            echo "omarchy=false" >> "$GITHUB_OUTPUT"
          fi

  # Checks that need no .NET build: generated files, the deck and Omarchy
  # plugins' own tests, the HTTP API description, packaging recipes and
  # shell scripts.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions agree everywhere
        run: tools/check-version.sh

      - name: Generated files match their sources
        run: |
          python3 tools/deck-skins.py --check
          python3 tools/deck-icons.py --check
          python3 tools/eq-reference.py --check
          python3 tools/omarchy-skins.py --check
          python3 packaging/flatpak/nuget-sources.py --check

      - name: Validate Stream Deck/OpenDeck plugin
        run: |
          node --check plugin/com.emaspa.openxlr.sdPlugin/plugin.mjs
          python3 -m json.tool plugin/com.emaspa.openxlr.sdPlugin/manifest.json >/dev/null
          node --test plugin/tests/*.test.mjs

      - name: Validate Chromium browser routing
        run: |
          python3 -m json.tool browser/chromium/manifest.json >/dev/null
          python3 -m json.tool browser/native-host.json >/dev/null
          for file in browser/chromium/*.mjs; do node --check "$file"; done
          node --test browser/tests/*.test.mjs
          node --check browser/tests/chromium-integration.mjs
          python3 -I tools/browser-extension.py --check
          python3 tools/test-browser-extension.py

      - name: Validate the Omarchy bar plugin
        run: |
          node --test packaging/omarchy/tests/*.test.mjs
          python3 -m json.tool packaging/omarchy/openxlr.mixer/manifest.json >/dev/null

      - name: HTTP API description
        run: python3 tools/check-openapi.py docs/openapi-v1.json

      - name: Lint shell scripts
        run: shellcheck --severity=error tools/check-version.sh tools/check-locked-restore.sh tools/ci-install-packages.sh packaging/ppa/make-source.sh packaging/omarchy/openxlr-omarchy-enable packaging/flatpak/openxlr-flatpak-service

      - name: Locked restore enforced on every packaging path
        run: tools/check-locked-restore.sh

      - name: RPM recipe claims every file it installs
        run: tools/check-spec.py packaging/rpm/openxlr.spec

      - name: Flatpak manifest and its files
        run: python3 packaging/flatpak/test-package.py

      - name: Validate packaged service inputs
        run: |
          test -f packaging/openxlr-daemon.service
          test -f packaging/70-openxlr.rules
          grep -q '0fd9' packaging/70-openxlr.rules

  omarchy-qml:
    needs: changes
    if: needs.changes.outputs.omarchy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base
    steps:
      - name: Install QML check tools
        run: pacman -Syu --noconfirm git python qt6-declarative qt6-websockets ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Omarchy QML with external type declarations
        run: python3 tools/check-omarchy.py
      - name: Exercise Omarchy strip controls with a fake daemon
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input packaging/omarchy/tests

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked to packages.lock.json)
        run: dotnet restore src/OpenXLR.slnx --locked-mode

      - name: Build
        run: dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Installation receipts and headless doctor
        run: |
          python3 tools/test-installation-receipt.py
          python3 packaging/yabridge/test-receipt.py

  # The native plugin host, its C and C++ tests, and the catalogue tests
  # that need lilv installed.
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Optional native LV2 host compiles
        run: |
          tools/ci-install-packages.sh pipewire pipewire-pulse wireplumber pulseaudio-utils swh-plugins lsp-plugins-lv2 g++ libpipewire-0.3-dev liblilv-dev lv2-dev libx11-dev libxtst6 xvfb xauth
          make -C native
          make -C native test-sound-check
          make -C native test-eq
          make -C native test-duck
          dotnet restore src/OpenXLR.slnx --locked-mode
          dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror -p:EnableNativeLv2Host=true
          test -x native/openxlr-lv2-host
          make -C native test-audio test-clap test-lv2 test-vst3 test-scan
          xvfb-run -a make -C native test-editor

      - name: LV2 catalogue metadata with lilv installed
        run: dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Lv2BundleTests|FullyQualifiedName~PluginSearchPathTests"

  # The private PipeWire suites run their tests one at a time and wait for
  # each graph to settle, so they take most of the time CI spends. Each
  # shard starts its own servers and runs a slice of the tests by name.
  audio:
    name: audio (${{ matrix.suite }} ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: monitor, shard: 1/3 }
          - { suite: monitor, shard: 2/3 }
          - { suite: monitor, shard: 3/3 }
          - { suite: dsp, shard: 1/2 }
          - { suite: dsp, shard: 2/2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build with the native host
        run: |
          tools/ci-install-packages.sh pipewire pipewire-pulse wireplumber pulseaudio-utils swh-plugins lsp-plugins-lv2 g++ libpipewire-0.3-dev liblilv-dev lv2-dev libx11-dev
          dotnet restore src/OpenXLR.slnx --locked-mode
          make -C native
          dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror -p:EnableNativeLv2Host=true

      - name: Desktop monitor volume controls
        if: matrix.suite == 'monitor'
        env:
          OPENXLR_TEST_SHARD: ${{ matrix.shard }}
        run: python3 tools/test-monitor-volume.py

      - name: Software ClipGuard audio and plugin latency with native LV2 inserts
        if: matrix.suite == 'dsp'
        env:
          OPENXLR_TEST_SHARD: ${{ matrix.shard }}
          OPENXLR_TEST_DSP: "1"
          OPENXLR_TEST_FILTER: FullyQualifiedName~DspAudioIntegrationTests|FullyQualifiedName~PluginLatencyIntegrationTests|FullyQualifiedName=OpenXLR.Tests.MonitorVolumeIntegrationTests.MixInsertAndPostLinksRecoverWithoutRestartingThePlugin
        run: LV2_PATH="/usr/lib/lv2:$PWD/native/tests" python3 tools/test-monitor-volume.py

  # The Xvfb window checks start the UI against a fake daemon, one virtual
  # screen per step. Two jobs of about equal length hold them.
  windows:
    name: windows (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [layout, skins]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          tools/ci-install-packages.sh libxtst6 xvfb xauth
          dotnet restore src/OpenXLR.slnx --locked-mode
          dotnet build src/OpenXLR.slnx -c Release --no-restore -warnaserror

      - name: Tray window lifecycle
        if: matrix.group == 'layout'
        run: OPENXLR_TEST_DESKTOP=1 xvfb-run -a dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~TrayWindowTests

      - name: Window layout at narrow and wide sizes
        if: matrix.group == 'layout'
        run: OPENXLR_TEST_LAYOUT=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~WindowLayoutTests

      - name: A tooltip at a screen edge does not take the click
        if: matrix.group == 'layout'
        run: OPENXLR_TEST_TOOLTIP=1 xvfb-run -a -s '-screen 0 1600x1000x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ToolTipInputTests

      - name: Skins reach every window and the default comes back
        if: matrix.group == 'skins'
        run: OPENXLR_TEST_SKIN=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~SkinWindowTests

      - name: Microphone EQ editor in every skin against a fake daemon
        if: matrix.group == 'skins'
        run: OPENXLR_TEST_EQ=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~EqEditorWindowTests

      - name: Capture input chains against a fake daemon
        if: matrix.group == 'skins'
        run: OPENXLR_TEST_CAPTURE=1 xvfb-run -a -s '-screen 0 2560x1440x24' dotnet test src/OpenXLR.Tests/OpenXLR.Tests.csproj -c Release --no-build --filter FullyQualifiedName~CaptureInputWindowTests

  # The ruleset requires this check and no other, so a job can be added,
  # split or gated on the changed paths without touching the ruleset. It
  # passes when every job it waits on passed or was skipped.
  ci-ok:
    needs: [changes, checks, omarchy-qml, unit, native, audio, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  # A failed nightly run opens an issue, or comments on the open one, so a
  # failure nobody was watching for is not lost.
  nightly-report:
    needs: ci-ok
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The nightly CI run on $(date -u +%F) failed: $RUN_URL"
          number=$(gh issue list --label ci-nightly --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create ci-nightly --color B60205 --description "Nightly CI failures" 2>/dev/null || true
            gh issue create --title "Nightly CI failed" --label ci-nightly --body "$body"
          fi
