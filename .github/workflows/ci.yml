name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (the tag is in the comment) so a moved
# tag upstream cannot change what runs here.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Versions agree everywhere
        run: tools/check-version.sh

      - name: Restore (locked to packages.lock.json)
        run: dotnet restore src/OpenXLR.slnx --locked-mode

      - name: Build
        run: dotnet build src/OpenXLR.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Validate Stream Deck/OpenDeck plugin
        run: |
          node --check plugin/com.emaspa.openxlr.sdPlugin/plugin.mjs
          python3 -m json.tool plugin/com.emaspa.openxlr.sdPlugin/manifest.json >/dev/null

      - name: Validate packaged service inputs
        run: |
          test -f packaging/openxlr-daemon.service
          test -f packaging/70-openxlr.rules
          grep -q '0fd9' packaging/70-openxlr.rules
