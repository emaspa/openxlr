name: Release .deb

on:
  release:
    types: [published]
  workflow_dispatch:

# The build job can only read. Writing to the release, and the provenance
# attestation, happen in a second job that never runs the build tools.
# Actions are pinned to commit SHAs (the tag is in the comment).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dotnet-sdk-10.0 lintian

      - name: Versions agree everywhere
        run: tools/check-version.sh

      - name: Run tests
        run: |
          dotnet build src/OpenXLR.slnx -c Release
          dotnet test src/OpenXLR.slnx -c Release --no-build

      - name: Build package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../openxlr_*.deb dist/

      # Warnings are reported, errors fail the build. No warning is silenced.
      - name: Lint package
        run: lintian --fail-on error dist/openxlr_*.deb

      - name: Checksums
        run: cd dist && sha256sum openxlr_*.deb > SHA256SUMS-deb.txt && cat SHA256SUMS-deb.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openxlr-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS-deb.txt

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openxlr-deb
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.deb dist/SHA256SUMS-deb.txt --repo '${{ github.repository }}'
