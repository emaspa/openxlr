# Weekly checks for NuGet packages (the lock files must be regenerated by
# the update, which Dependabot does) and for the pinned action SHAs.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
